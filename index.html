<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Trainer - Improve Your Typing Speed</title>
    <meta name="description" content="Free typing trainer to improve your typing speed and accuracy with real-time WPM tracking">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Lucide React icons as inline SVG components
        const RotateCcw = ({ className }) => (
            <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M3 21v-5h5"/>
            </svg>
        );

        const Trophy = ({ className }) => (
            <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
                <path d="M4 22h16"/>
                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
            </svg>
        );

        const Target = ({ className }) => (
            <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="6"/>
                <circle cx="12" cy="12" r="2"/>
            </svg>
        );

        const Zap = ({ className }) => (
            <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
            </svg>
        );

        const User = ({ className }) => (
            <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        );

        const Award = ({ className }) => (
            <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="8" r="6"/>
                <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
            </svg>
        );

        const X = ({ className }) => (
            <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 6 6 18"/>
                <path d="M6 6l12 12"/>
            </svg>
        );

        const BarChart = ({ className }) => (
            <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" x2="12" y1="20" y2="10"/>
                <line x1="18" x2="18" y1="20" y2="4"/>
                <line x1="6" x2="6" y1="20" y2="16"/>
            </svg>
        );

        const Gamepad = ({ className }) => (
            <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="6" x2="10" y1="12" y2="12"/>
                <line x1="8" x2="8" y1="10" y2="14"/>
                <line x1="15" x2="15.01" y1="13" y2="13"/>
                <line x1="18" x2="18.01" y1="11" y2="11"/>
                <rect width="20" height="12" x="2" y="6" rx="2"/>
            </svg>
        );

        const Heart = ({ className }) => (
            <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
        );

        const BookOpen = ({ className }) => (
            <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
        );

        const TypingTrainer = () => {
            // Tab and Mode States
            const [currentTab, setCurrentTab] = useState('practice');

            // Practice Mode States
            const [difficulty, setDifficulty] = useState('medium');
            const [currentText, setCurrentText] = useState('');
            const [userInput, setUserInput] = useState('');
            const [isActive, setIsActive] = useState(false);
            const [startTime, setStartTime] = useState(null);
            const [wpm, setWpm] = useState(0);
            const [accuracy, setAccuracy] = useState(100);
            const [isComplete, setIsComplete] = useState(false);
            const inputRef = useRef(null);

            // Game Mode States
            const [gameActive, setGameActive] = useState(false);
            const [gameScore, setGameScore] = useState(0);
            const [gameLives, setGameLives] = useState(3);
            const [fallingWords, setFallingWords] = useState([]);
            const [gameInput, setGameInput] = useState('');
            const [gameOver, setGameOver] = useState(false);
            const gameInputRef = useRef(null);

            // Profile and High Score States
            const [profile, setProfile] = useState(null);
            const [showProfileModal, setShowProfileModal] = useState(false);
            const [showStatsModal, setShowStatsModal] = useState(false);
            const [tempUsername, setTempUsername] = useState('');
            const [tempAvatar, setTempAvatar] = useState('🎯');
            const [highScores, setHighScores] = useState({
                easy: { bestWpm: 0, bestAccuracy: 0 },
                medium: { bestWpm: 0, bestAccuracy: 0 },
                hard: { bestWpm: 0, bestAccuracy: 0 },
                game: { bestScore: 0 }
            });

            const avatarOptions = ['🎯', '🚀', '⚡', '🔥', '💎', '🎨', '🌟', '🎮', '🏆', '🦄', '🐱', '🐶'];

            const texts = {
                easy: [
                    "The quick brown fox jumps over the lazy dog.",
                    "Pack my box with five dozen liquor jugs.",
                    "How vexingly quick daft zebras jump.",
                    "The five boxing wizards jump quickly.",
                    "Bright vixens jump; dozy fowl quack."
                ],
                medium: [
                    "In the midst of chaos, there is also opportunity. Focus on what you can control and let go of the rest.",
                    "Success is not final, failure is not fatal: it is the courage to continue that counts in the end.",
                    "The only way to do great work is to love what you do and never stop learning from mistakes.",
                    "Practice makes perfect, but perfect practice makes champions who rise above all challenges.",
                    "Typing speed increases with consistent practice and dedication to improving your skills daily."
                ],
                hard: [
                    "Sophisticated algorithms and intricate data structures require meticulous attention to detail, precise implementation, and thorough testing procedures.",
                    "The extraordinary juxtaposition of quantum mechanics and relativistic physics challenges conventional understanding of reality's fundamental nature.",
                    "Cryptocurrency blockchain technology revolutionizes decentralized financial transactions through cryptographic verification and distributed consensus mechanisms.",
                    "Neuroplasticity demonstrates the brain's remarkable capacity to reorganize synaptic connections throughout life, adapting to experiences and learning.",
                    "Epistemological frameworks encompass various methodologies for acquiring knowledge, distinguishing between empirical observation and rational deduction."
                ]
            };

            // Game words by difficulty
            const gameWords = {
                easy: ['cat', 'dog', 'run', 'jump', 'play', 'code', 'type', 'fast', 'word', 'game', 'fun', 'key', 'hit', 'win', 'go', 'yes', 'try', 'ace', 'top', 'pro'],
                medium: ['react', 'speed', 'quick', 'hello', 'world', 'score', 'level', 'power', 'swift', 'ninja', 'focus', 'tiger', 'laser', 'boost', 'chain', 'pixel', 'flash', 'spark', 'blitz', 'storm'],
                hard: ['algorithm', 'javascript', 'developer', 'keyboard', 'challenge', 'lightning', 'precision', 'velocity', 'performance', 'mastery', 'expertise', 'excellence', 'champion', 'dominate', 'unstoppable', 'legendary', 'phenomenal', 'spectacular']
            };

            // LocalStorage Functions
            const loadProfile = () => {
                const saved = localStorage.getItem('typingTrainerProfile');
                if (saved) {
                    const parsedProfile = JSON.parse(saved);
                    setProfile(parsedProfile);
                    setTempUsername(parsedProfile.username);
                    setTempAvatar(parsedProfile.avatar);
                    return parsedProfile;
                }
                return null;
            };

            const saveProfile = (profileData) => {
                localStorage.setItem('typingTrainerProfile', JSON.stringify(profileData));
                setProfile(profileData);
            };

            const loadHighScores = () => {
                const saved = localStorage.getItem('typingTrainerHighScores');
                if (saved) {
                    setHighScores(JSON.parse(saved));
                }
            };

            const saveHighScores = (scores) => {
                localStorage.setItem('typingTrainerHighScores', JSON.stringify(scores));
                setHighScores(scores);
            };

            const updateHighScore = (currentWpm, currentAccuracy) => {
                const currentBest = highScores[difficulty];
                const newHighScores = { ...highScores };
                let updated = false;

                if (currentWpm > currentBest.bestWpm) {
                    newHighScores[difficulty].bestWpm = currentWpm;
                    updated = true;
                }
                if (currentAccuracy > currentBest.bestAccuracy) {
                    newHighScores[difficulty].bestAccuracy = currentAccuracy;
                    updated = true;
                }

                if (updated) {
                    saveHighScores(newHighScores);
                }
                return updated;
            };

            const getRandomText = () => {
                const textArray = texts[difficulty];
                return textArray[Math.floor(Math.random() * textArray.length)];
            };

            // Game Functions
            const getRandomWord = () => {
                const wordArray = gameWords[difficulty];
                return wordArray[Math.floor(Math.random() * wordArray.length)];
            };

            const spawnWord = () => {
                const newWord = {
                    id: Date.now() + Math.random(),
                    text: getRandomWord(),
                    x: Math.random() * 80 + 10, // 10% to 90% of screen width
                    y: 0,
                    speed: difficulty === 'easy' ? 0.5 : difficulty === 'medium' ? 0.8 : 1.2
                };
                setFallingWords(prev => [...prev, newWord]);
            };

            const startGame = () => {
                setGameActive(true);
                setGameOver(false);
                setGameScore(0);
                setGameLives(3);
                setFallingWords([]);
                setGameInput('');
                gameInputRef.current?.focus();
            };

            const endGame = () => {
                setGameActive(false);
                setGameOver(true);

                // Update high score
                const newHighScores = { ...highScores };
                if (gameScore > highScores.game.bestScore) {
                    newHighScores.game.bestScore = gameScore;
                    saveHighScores(newHighScores);
                }
            };

            const handleGameInput = (e) => {
                const value = e.target.value;
                setGameInput(value);

                // Check if typed word matches any falling word
                const matchedWord = fallingWords.find(word => word.text === value.trim());
                if (matchedWord) {
                    // Remove matched word and increase score
                    setFallingWords(prev => prev.filter(w => w.id !== matchedWord.id));
                    setGameScore(prev => prev + matchedWord.text.length * 10);
                    setGameInput('');
                }
            };

            // Load profile and scores on mount
            useEffect(() => {
                const loadedProfile = loadProfile();
                loadHighScores();
                if (!loadedProfile) {
                    setShowProfileModal(true);
                }
            }, []);

            useEffect(() => {
                setCurrentText(getRandomText());
            }, [difficulty]);

            useEffect(() => {
                if (isActive && startTime) {
                    const interval = setInterval(() => {
                        const timeElapsed = (Date.now() - startTime) / 1000 / 60;
                        const wordsTyped = userInput.trim().split(/\s+/).length;
                        const calculatedWpm = Math.round(wordsTyped / timeElapsed) || 0;
                        setWpm(calculatedWpm);
                    }, 100);
                    return () => clearInterval(interval);
                }
            }, [isActive, startTime, userInput]);

            useEffect(() => {
                const correctChars = userInput.split('').filter((char, idx) => char === currentText[idx]).length;
                const totalChars = userInput.length;
                const calculatedAccuracy = totalChars > 0 ? Math.round((correctChars / totalChars) * 100) : 100;
                setAccuracy(calculatedAccuracy);

                if (userInput === currentText) {
                    setIsComplete(true);
                    setIsActive(false);
                    // Update high scores when exercise is completed
                    updateHighScore(wpm, calculatedAccuracy);
                }
            }, [userInput, currentText]);

            // Game: Spawn words periodically
            useEffect(() => {
                if (gameActive) {
                    const spawnInterval = setInterval(() => {
                        spawnWord();
                    }, difficulty === 'easy' ? 2000 : difficulty === 'medium' ? 1500 : 1000);
                    return () => clearInterval(spawnInterval);
                }
            }, [gameActive, difficulty]);

            // Game: Update word positions and check for game over
            useEffect(() => {
                if (gameActive) {
                    const updateInterval = setInterval(() => {
                        setFallingWords(prev => {
                            const updated = prev.map(word => ({
                                ...word,
                                y: word.y + word.speed
                            }));

                            // Check if any word reached the bottom
                            const reachedBottom = updated.filter(word => word.y >= 100);
                            if (reachedBottom.length > 0) {
                                setGameLives(lives => {
                                    const newLives = lives - reachedBottom.length;
                                    if (newLives <= 0) {
                                        endGame();
                                        return 0;
                                    }
                                    return newLives;
                                });
                            }

                            // Remove words that reached the bottom
                            return updated.filter(word => word.y < 100);
                        });
                    }, 50);
                    return () => clearInterval(updateInterval);
                }
            }, [gameActive]);

            const handleInputChange = (e) => {
                const value = e.target.value;
                
                if (!isActive && value.length > 0) {
                    setIsActive(true);
                    setStartTime(Date.now());
                }
                
                if (value.length <= currentText.length) {
                    setUserInput(value);
                }
            };

            const resetTrainer = () => {
                setUserInput('');
                setIsActive(false);
                setStartTime(null);
                setWpm(0);
                setAccuracy(100);
                setIsComplete(false);
                setCurrentText(getRandomText());
                inputRef.current?.focus();
            };

            const getCharClass = (charIndex) => {
                if (charIndex >= userInput.length) return 'text-zinc-600';
                return userInput[charIndex] === currentText[charIndex] ? 'text-emerald-500' : 'text-red-500 bg-red-900/30';
            };

            const handleSaveProfile = () => {
                if (tempUsername.trim()) {
                    saveProfile({
                        username: tempUsername.trim(),
                        avatar: tempAvatar,
                        createdAt: profile?.createdAt || new Date().toISOString()
                    });
                    setShowProfileModal(false);
                }
            };

            return (
                <div className="min-h-screen bg-black p-4 sm:p-8">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-zinc-900 rounded-lg shadow-xl p-6 sm:p-8 border border-zinc-800">
                            {/* Header with Profile */}
                            <div className="flex justify-between items-start mb-8">
                                <div className="text-center flex-1">
                                    <h1 className="text-3xl sm:text-4xl font-bold text-white mb-2">Typing Trainer</h1>
                                    <p className="text-zinc-400 text-sm sm:text-base">Improve your typing speed and accuracy</p>
                                </div>
                                {profile && (
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => setShowStatsModal(true)}
                                            className="bg-zinc-800 hover:bg-zinc-700 text-white p-2 rounded-lg transition-colors"
                                            title="View Statistics"
                                        >
                                            <BarChart className="w-5 h-5" />
                                        </button>
                                        <button
                                            onClick={() => setShowProfileModal(true)}
                                            className="bg-zinc-800 hover:bg-zinc-700 text-white px-3 py-2 rounded-lg transition-colors flex items-center gap-2"
                                            title="Edit Profile"
                                        >
                                            <span className="text-xl">{profile.avatar}</span>
                                            <span className="hidden sm:inline text-sm font-medium">{profile.username}</span>
                                        </button>
                                    </div>
                                )}
                            </div>

                            {/* Tab Navigation */}
                            <div className="flex justify-center gap-2 mb-8">
                                <button
                                    onClick={() => setCurrentTab('practice')}
                                    className={`px-6 py-3 rounded-lg font-semibold transition-all flex items-center gap-2 ${
                                        currentTab === 'practice'
                                            ? 'bg-emerald-500 text-black'
                                            : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700'
                                    }`}
                                >
                                    <BookOpen className="w-5 h-5" />
                                    Practice
                                </button>
                                <button
                                    onClick={() => setCurrentTab('game')}
                                    className={`px-6 py-3 rounded-lg font-semibold transition-all flex items-center gap-2 ${
                                        currentTab === 'game'
                                            ? 'bg-emerald-500 text-black'
                                            : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700'
                                    }`}
                                >
                                    <Gamepad className="w-5 h-5" />
                                    Game
                                </button>
                            </div>

                            {/* Practice Mode */}
                            {currentTab === 'practice' && (
                                <>
                                    {/* Difficulty Selector */}
                                    <div className="flex justify-center gap-2 sm:gap-3 mb-8">
                                        {['easy', 'medium', 'hard'].map((level) => (
                                            <button
                                                key={level}
                                                onClick={() => {
                                                    setDifficulty(level);
                                                    resetTrainer();
                                                }}
                                                className={`px-4 sm:px-6 py-2 rounded-full font-medium transition-all text-sm sm:text-base ${
                                                    difficulty === level
                                                        ? 'bg-emerald-500 text-black'
                                                        : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700'
                                                }`}
                                            >
                                                {level.charAt(0).toUpperCase() + level.slice(1)}
                                            </button>
                                        ))}
                                    </div>

                            {/* Stats Display */}
                            <div className="grid grid-cols-3 gap-3 sm:gap-4 mb-8">
                                <div className="bg-zinc-800 rounded-lg p-3 sm:p-4 text-center border border-zinc-700">
                                    <div className="flex items-center justify-center mb-2">
                                        <Zap className="w-4 h-4 sm:w-5 sm:h-5 text-emerald-500 mr-2" />
                                        <span className="text-xs sm:text-sm font-medium text-zinc-400">WPM</span>
                                    </div>
                                    <div className="text-2xl sm:text-3xl font-bold text-white">{wpm}</div>
                                </div>
                                
                                <div className="bg-zinc-800 rounded-lg p-3 sm:p-4 text-center border border-zinc-700">
                                    <div className="flex items-center justify-center mb-2">
                                        <Target className="w-4 h-4 sm:w-5 sm:h-5 text-emerald-500 mr-2" />
                                        <span className="text-xs sm:text-sm font-medium text-zinc-400">Accuracy</span>
                                    </div>
                                    <div className="text-2xl sm:text-3xl font-bold text-white">{accuracy}%</div>
                                </div>
                                
                                <div className="bg-zinc-800 rounded-lg p-3 sm:p-4 text-center border border-zinc-700">
                                    <div className="flex items-center justify-center mb-2">
                                        <Trophy className="w-4 h-4 sm:w-5 sm:h-5 text-emerald-500 mr-2" />
                                        <span className="text-xs sm:text-sm font-medium text-zinc-400">Progress</span>
                                    </div>
                                    <div className="text-2xl sm:text-3xl font-bold text-white">
                                        {Math.round((userInput.length / currentText.length) * 100)}%
                                    </div>
                                </div>
                            </div>

                            {/* Text Display */}
                            <div className="bg-black rounded-lg p-4 sm:p-6 mb-6 border border-zinc-800">
                                <div className="text-lg sm:text-2xl leading-relaxed font-mono select-none">
                                    {currentText.split('').map((char, idx) => (
                                        <span key={idx} className={getCharClass(idx)}>
                                            {char}
                                        </span>
                                    ))}
                                </div>
                            </div>

                            {/* Input Area */}
                            <div className="mb-6">
                                <input
                                    ref={inputRef}
                                    type="text"
                                    value={userInput}
                                    onChange={handleInputChange}
                                    disabled={isComplete}
                                    className="w-full text-lg sm:text-2xl p-3 sm:p-4 bg-zinc-800 border-2 border-zinc-700 text-white rounded-lg font-mono focus:outline-none focus:border-emerald-500 disabled:bg-zinc-900 disabled:cursor-not-allowed transition-colors placeholder-zinc-600"
                                    placeholder="Start typing here..."
                                    autoFocus
                                />
                            </div>

                            {/* Completion Message */}
                            {isComplete && (
                                <div className="bg-emerald-500 text-black rounded-lg p-6 mb-6 text-center">
                                    <Trophy className="w-10 h-10 sm:w-12 sm:h-12 mx-auto mb-3" />
                                    <h2 className="text-xl sm:text-2xl font-bold mb-2">Great Job!</h2>
                                    <p className="text-sm sm:text-lg font-medium">
                                        You completed this exercise with {wpm} WPM and {accuracy}% accuracy!
                                    </p>
                                </div>
                            )}

                            {/* Reset Button */}
                            <button
                                onClick={resetTrainer}
                                className="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-semibold py-3 px-6 rounded-full transition-colors flex items-center justify-center gap-2"
                            >
                                <RotateCcw className="w-5 h-5" />
                                New Text
                            </button>

                                    {/* Instructions */}
                                    <div className="mt-6 text-center text-xs sm:text-sm text-zinc-500">
                                        <p>Choose a difficulty level, then start typing to begin. Your WPM and accuracy are tracked in real-time.</p>
                                    </div>
                                </>
                            )}

                            {/* Game Mode */}
                            {currentTab === 'game' && (
                                <>
                                    {/* Difficulty Selector */}
                                    <div className="flex justify-center gap-2 sm:gap-3 mb-8">
                                        {['easy', 'medium', 'hard'].map((level) => (
                                            <button
                                                key={level}
                                                onClick={() => setDifficulty(level)}
                                                className={`px-4 sm:px-6 py-2 rounded-full font-medium transition-all text-sm sm:text-base ${
                                                    difficulty === level
                                                        ? 'bg-emerald-500 text-black'
                                                        : 'bg-zinc-800 text-zinc-300 hover:bg-zinc-700'
                                                }`}
                                            >
                                                {level.charAt(0).toUpperCase() + level.slice(1)}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Game Stats */}
                                    <div className="grid grid-cols-3 gap-3 sm:gap-4 mb-6">
                                        <div className="bg-zinc-800 rounded-lg p-3 sm:p-4 text-center border border-zinc-700">
                                            <div className="flex items-center justify-center mb-2">
                                                <Trophy className="w-4 h-4 sm:w-5 sm:h-5 text-emerald-500 mr-2" />
                                                <span className="text-xs sm:text-sm font-medium text-zinc-400">Score</span>
                                            </div>
                                            <div className="text-2xl sm:text-3xl font-bold text-white">{gameScore}</div>
                                        </div>

                                        <div className="bg-zinc-800 rounded-lg p-3 sm:p-4 text-center border border-zinc-700">
                                            <div className="flex items-center justify-center mb-2">
                                                <Heart className="w-4 h-4 sm:w-5 sm:h-5 text-red-500 mr-2" />
                                                <span className="text-xs sm:text-sm font-medium text-zinc-400">Lives</span>
                                            </div>
                                            <div className="text-2xl sm:text-3xl font-bold text-white">{gameLives}</div>
                                        </div>

                                        <div className="bg-zinc-800 rounded-lg p-3 sm:p-4 text-center border border-zinc-700">
                                            <div className="flex items-center justify-center mb-2">
                                                <Award className="w-4 h-4 sm:w-5 sm:h-5 text-yellow-500 mr-2" />
                                                <span className="text-xs sm:text-sm font-medium text-zinc-400">Best</span>
                                            </div>
                                            <div className="text-2xl sm:text-3xl font-bold text-white">{highScores.game.bestScore}</div>
                                        </div>
                                    </div>

                                    {/* Game Area */}
                                    <div className="bg-black rounded-lg p-4 mb-6 border border-zinc-800 relative overflow-hidden" style={{ height: '400px' }}>
                                        {!gameActive && !gameOver && (
                                            <div className="absolute inset-0 flex items-center justify-center">
                                                <button
                                                    onClick={startGame}
                                                    className="bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-4 px-8 rounded-full text-xl transition-colors flex items-center gap-3"
                                                >
                                                    <Zap className="w-6 h-6" />
                                                    Start Game
                                                </button>
                                            </div>
                                        )}

                                        {gameOver && (
                                            <div className="absolute inset-0 flex items-center justify-center bg-black bg-opacity-90">
                                                <div className="text-center">
                                                    <Trophy className="w-16 h-16 mx-auto mb-4 text-emerald-500" />
                                                    <h2 className="text-3xl font-bold text-white mb-2">Game Over!</h2>
                                                    <p className="text-xl text-zinc-400 mb-6">Final Score: {gameScore}</p>
                                                    {gameScore === highScores.game.bestScore && gameScore > 0 && (
                                                        <p className="text-emerald-500 font-semibold mb-6">New High Score!</p>
                                                    )}
                                                    <button
                                                        onClick={startGame}
                                                        className="bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-3 px-6 rounded-full transition-colors"
                                                    >
                                                        Play Again
                                                    </button>
                                                </div>
                                            </div>
                                        )}

                                        {gameActive && (
                                            <>
                                                {fallingWords.map(word => (
                                                    <div
                                                        key={word.id}
                                                        className="absolute text-white font-mono text-xl font-bold bg-zinc-800 px-3 py-2 rounded-lg border-2 border-emerald-500 shadow-lg"
                                                        style={{
                                                            left: `${word.x}%`,
                                                            top: `${word.y}%`,
                                                            transition: 'top 0.05s linear',
                                                            transform: 'translateX(-50%)'
                                                        }}
                                                    >
                                                        {word.text}
                                                    </div>
                                                ))}
                                            </>
                                        )}
                                    </div>

                                    {/* Game Input */}
                                    <div className="mb-6">
                                        <input
                                            ref={gameInputRef}
                                            type="text"
                                            value={gameInput}
                                            onChange={handleGameInput}
                                            disabled={!gameActive}
                                            className="w-full text-lg sm:text-2xl p-3 sm:p-4 bg-zinc-800 border-2 border-zinc-700 text-white rounded-lg font-mono focus:outline-none focus:border-emerald-500 disabled:bg-zinc-900 disabled:cursor-not-allowed transition-colors placeholder-zinc-600"
                                            placeholder={gameActive ? "Type the falling words..." : "Click Start Game to begin"}
                                        />
                                    </div>

                                    {/* Game Instructions */}
                                    <div className="text-center text-xs sm:text-sm text-zinc-500">
                                        <p>Type the falling words before they reach the bottom! Each missed word costs a life.</p>
                                    </div>
                                </>
                            )}
                        </div>

                        {/* Profile Modal */}
                        {showProfileModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
                                <div className="bg-zinc-900 rounded-lg p-6 sm:p-8 max-w-md w-full border border-zinc-800">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                                            <User className="w-6 h-6" />
                                            {profile ? 'Edit Profile' : 'Create Profile'}
                                        </h2>
                                        {profile && (
                                            <button
                                                onClick={() => setShowProfileModal(false)}
                                                className="text-zinc-400 hover:text-white transition-colors"
                                            >
                                                <X className="w-6 h-6" />
                                            </button>
                                        )}
                                    </div>

                                    <div className="space-y-6">
                                        <div>
                                            <label className="block text-sm font-medium text-zinc-400 mb-2">
                                                Username
                                            </label>
                                            <input
                                                type="text"
                                                value={tempUsername}
                                                onChange={(e) => setTempUsername(e.target.value)}
                                                placeholder="Enter your username"
                                                className="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 text-white rounded-lg focus:outline-none focus:border-emerald-500 transition-colors"
                                                maxLength={20}
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-zinc-400 mb-3">
                                                Choose Avatar
                                            </label>
                                            <div className="grid grid-cols-6 gap-2">
                                                {avatarOptions.map((avatar) => (
                                                    <button
                                                        key={avatar}
                                                        onClick={() => setTempAvatar(avatar)}
                                                        className={`text-3xl p-3 rounded-lg transition-all ${
                                                            tempAvatar === avatar
                                                                ? 'bg-emerald-500 scale-110'
                                                                : 'bg-zinc-800 hover:bg-zinc-700'
                                                        }`}
                                                    >
                                                        {avatar}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <button
                                            onClick={handleSaveProfile}
                                            disabled={!tempUsername.trim()}
                                            className="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-semibold py-3 px-6 rounded-full transition-colors disabled:bg-zinc-700 disabled:text-zinc-500 disabled:cursor-not-allowed"
                                        >
                                            {profile ? 'Save Changes' : 'Create Profile'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Stats Modal */}
                        {showStatsModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50">
                                <div className="bg-zinc-900 rounded-lg p-6 sm:p-8 max-w-2xl w-full border border-zinc-800">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                                            <Award className="w-6 h-6" />
                                            Your Statistics
                                        </h2>
                                        <button
                                            onClick={() => setShowStatsModal(false)}
                                            className="text-zinc-400 hover:text-white transition-colors"
                                        >
                                            <X className="w-6 h-6" />
                                        </button>
                                    </div>

                                    {/* Profile Info */}
                                    {profile && (
                                        <div className="bg-zinc-800 rounded-lg p-4 mb-6 flex items-center gap-4">
                                            <span className="text-5xl">{profile.avatar}</span>
                                            <div>
                                                <h3 className="text-xl font-bold text-white">{profile.username}</h3>
                                                <p className="text-sm text-zinc-400">
                                                    Member since {new Date(profile.createdAt).toLocaleDateString()}
                                                </p>
                                            </div>
                                        </div>
                                    )}

                                    {/* High Scores */}
                                    <div className="space-y-4">
                                        <h3 className="text-lg font-semibold text-white mb-4">High Scores by Difficulty</h3>

                                        {['easy', 'medium', 'hard'].map((level) => (
                                            <div key={level} className="bg-zinc-800 rounded-lg p-4 border border-zinc-700">
                                                <div className="flex items-center justify-between mb-3">
                                                    <span className="text-lg font-semibold text-white capitalize">
                                                        {level}
                                                    </span>
                                                    <Trophy className="w-5 h-5 text-emerald-500" />
                                                </div>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <p className="text-xs text-zinc-400 mb-1">Best WPM</p>
                                                        <p className="text-2xl font-bold text-emerald-500">
                                                            {highScores[level].bestWpm}
                                                        </p>
                                                    </div>
                                                    <div>
                                                        <p className="text-xs text-zinc-400 mb-1">Best Accuracy</p>
                                                        <p className="text-2xl font-bold text-emerald-500">
                                                            {highScores[level].bestAccuracy}%
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}

                                        {/* Game High Score */}
                                        <div className="bg-zinc-800 rounded-lg p-4 border border-zinc-700 mt-4">
                                            <div className="flex items-center justify-between mb-3">
                                                <span className="text-lg font-semibold text-white">
                                                    Typing Game
                                                </span>
                                                <Gamepad className="w-5 h-5 text-emerald-500" />
                                            </div>
                                            <div>
                                                <p className="text-xs text-zinc-400 mb-1">Best Score</p>
                                                <p className="text-2xl font-bold text-emerald-500">
                                                    {highScores.game.bestScore}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TypingTrainer />);
    </script>
</body>
</html>
